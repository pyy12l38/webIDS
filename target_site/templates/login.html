<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>登录 - My Blog</title>

  <style>
    :root{
      --bg:#f5f5f7;
      --card-bg:rgba(255,255,255,.72);
      --border:rgba(0,0,0,.06);
      --text:#1d1d1f;
      --muted:#6e6e73;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --blue:#0071e3;
      --danger:#ff5a6a;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #fff 100%);
      color:var(--text);
    }

    .navbar{
      position: sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 60px;
      backdrop-filter: blur(18px);
      background: rgba(245,245,247,.75);
      border-bottom:1px solid var(--border);
    }
    .logo{
      font-size:18px;
      font-weight:600;
      letter-spacing:-0.3px;
      text-decoration:none;
      color:var(--text);
    }
    .nav-links a{
      margin-left:18px;
      text-decoration:none;
      color:var(--muted);
      font-size:14px;
      transition:.2s;
    }
    .nav-links a:hover{ color:var(--text); }

    .container{
      max-width: 980px;
      margin:0 auto;
      padding: 40px 20px 60px;
      display:flex;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width: 460px;
      backdrop-filter: blur(18px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    h1{
      margin:0;
      font-size:22px;
      font-weight:700;
      letter-spacing:-0.4px;
    }
    p{
      margin:10px 0 18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }

    label{
      display:block;
      margin:12px 0 6px;
      font-size:13px;
      color:var(--muted);
    }
    input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.9);
      color:var(--text);
      outline:none;
    }
    input:focus{
      border-color: rgba(0,113,227,.35);
      box-shadow: 0 0 0 4px rgba(0,113,227,.12);
    }

    .btn{
      width:100%;
      margin-top:16px;
      padding:12px 14px;
      border:none;
      border-radius:12px;
      background: linear-gradient(180deg, rgba(0,113,227,1), rgba(0,95,204,1));
      color:#fff;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }
    .btn:hover{ filter:brightness(1.05); }

    .err{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,90,106,.22);
      background: rgba(255,90,106,.08);
      color: #b4232d;
      font-size:13px;
    }

    .meta{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:13px;
      color:var(--muted);
    }
    .meta a{
      color:var(--blue);
      text-decoration:none;
      font-weight:600;
    }
    .meta a:hover{ text-decoration:underline; }

    @media (max-width: 960px){
      .navbar{ padding:16px 18px; }
    }
  </style>
</head>

<body>
  <div class="navbar">
    <a class="logo" href="/">My Blog</a>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="/playground">功能实验区</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1>登录后台</h1>
      <p>请输入管理员账号密码进入后台管理页面。</p>

      <form action="/login" method="POST">
        <label>用户名</label>
        <input name="username" placeholder="例如：admin" autocomplete="username"/>

        <label>密码</label>
        <input name="password" type="password" placeholder="请输入密码" autocomplete="current-password"/>

        <button class="btn" type="submit">登录</button>

        {% if error %}
          <div class="err">{{ error }}</div>
        {% endif %}
      </form>

      <div class="meta">
        <span>Demo：admin / admin123</span>
        <a href="/">返回首页 →</a>
      </div>
    </div>
  </div>
</body>
</html>
