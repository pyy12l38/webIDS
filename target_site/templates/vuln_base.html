<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page_title }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #d7deea;
      --text: #163047;
      --muted: #58708a;
      --primary: #2e68ff;
      --danger: #d9485f;
      --success: #218a5b;
      --code: #0d1b2a;
      --shadow: 0 12px 40px rgba(20, 48, 76, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 26px;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
      background: rgba(248, 251, 255, 0.82);
    }

    .logo {
      font-size: 18px;
      font-weight: 760;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 12px;
      transition: .2s ease;
    }

    .nav-links a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.85);
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.8px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: .2s ease;
    }

    .back-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(20, 48, 76, 0.08);
    }

    .panel {
      background: var(--card);
      border: 1px solid rgba(196, 207, 224, 0.85);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: -0.3px;
    }

    .panel p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    input:focus, textarea:focus {
      border-color: rgba(46, 104, 255, 0.45);
      box-shadow: 0 0 0 4px rgba(46, 104, 255, 0.12);
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    button.secondary {
      background: #e9eef8;
      color: var(--text);
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .example-link {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid #bfd0ff;
      background: #eef4ff;
      color: #1f52d1;
      text-decoration: none;
      padding: 10px 14px;
      font-size: 13px;
    }

    .code, pre {
      margin: 0;
      background: var(--code);
      color: #e7f0fb;
      border-radius: 16px;
      padding: 16px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .notice,
    .success {
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.7;
    }

    .notice {
      border: 1px solid #ffd4da;
      background: #fff3f5;
      color: var(--danger);
    }

    .success {
      border: 1px solid #cdebdc;
      background: #eefaf3;
      color: var(--success);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .link-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .link-list a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .link-list a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .navbar {
        padding: 14px 16px;
      }

      .header {
        flex-direction: column;
      }

      .header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a class="logo" href="/">My Blog / Python 博客功能实验区</a>
    <div class="nav-links">
      <a href="/">博客首页</a>
      <a href="/playground">功能实验区</a>
      <a href="/auth/demo-login">认证测试</a>
      <a href="/admin/exposed">管理入口</a>
    </div>
  </div>

  <main class="page">
    <div class="header">
      <div>
        <h1>{{ page_title }}</h1>
        <p>{{ page_desc }}</p>
      </div>
      <a class="back-link" href="/playground">返回功能实验区</a>
    </div>

    {% block content %}{% endblock %}
  </main>
</body>
</html>
