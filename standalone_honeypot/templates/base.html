<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Standalone Honeypot{% endblock %}</title>
  <style>
    :root {
      --bg: #0c111b;
      --panel: rgba(14, 23, 38, 0.82);
      --panel-strong: rgba(18, 28, 46, 0.95);
      --line: rgba(106, 150, 214, 0.25);
      --text: #eef4ff;
      --muted: #9ab0d1;
      --accent: #4fd1c5;
      --accent-2: #ff8a3d;
      --danger: #ff5f6d;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(79, 209, 197, 0.12), transparent 24%),
        radial-gradient(circle at top left, rgba(255, 138, 61, 0.10), transparent 20%),
        linear-gradient(180deg, #09101a, #0c111b 35%, #0f1724);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto;
    }

    .hero,
    .panel {
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -30% auto;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(79, 209, 197, 0.28), transparent 60%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(79, 209, 197, 0.12);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 58px);
      line-height: 0.98;
      max-width: 720px;
    }

    .hero p {
      margin: 16px 0 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      margin-top: 18px;
    }

    .card {
      padding: 18px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18, 28, 46, 0.95), rgba(13, 22, 35, 0.92));
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(79, 209, 197, 0.5);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .card p,
    .muted {
      color: var(--muted);
      line-height: 1.65;
    }

    .panel {
      margin-top: 18px;
      padding: 22px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .row {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(106, 150, 214, 0.24);
      background: rgba(7, 13, 22, 0.84);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    textarea {
      min-height: 200px;
      resize: vertical;
      font-family: "SFMono-Regular", "JetBrains Mono", monospace;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 14px;
      border: 0;
      background: linear-gradient(135deg, var(--accent), #2587a8);
      color: #031018;
      font-weight: 700;
      cursor: pointer;
    }

    .button.secondary {
      background: linear-gradient(135deg, rgba(255, 138, 61, 0.95), rgba(255, 95, 109, 0.95));
      color: #180701;
    }

    .notice {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 95, 109, 0.12);
      color: #ffc1c8;
      border: 1px solid rgba(255, 95, 109, 0.26);
      line-height: 1.6;
    }

    .code {
      padding: 16px;
      border-radius: 18px;
      background: rgba(7, 13, 22, 0.86);
      border: 1px solid rgba(106, 150, 214, 0.18);
      font-family: "SFMono-Regular", "JetBrains Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
      color: #d8e6ff;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(106, 150, 214, 0.18);
      vertical-align: top;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(79, 209, 197, 0.14);
      color: var(--accent);
    }

    .footer {
      margin: 18px 0 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 20px, 1180px);
      }

      .hero,
      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    {% block body %}{% endblock %}
    <div class="footer">Standalone Honeypot Lab</div>
  </main>
</body>
</html>
