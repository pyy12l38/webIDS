worker_processes  1;

error_log  /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/logs/nginx_error.log warn;
pid        /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/deploy/tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    charset utf-8;

    client_body_temp_path /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/deploy/tmp/client_body;
    proxy_temp_path       /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/deploy/tmp/proxy;
    fastcgi_temp_path     /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/deploy/tmp/fastcgi;
    uwsgi_temp_path       /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/deploy/tmp/uwsgi;
    scgi_temp_path        /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/deploy/tmp/scgi;

    map $request_uri $ids_log_path {
        ~^([^?]*) $1;
        default $uri;
    }

    map $request_uri $ids_log_args {
        ~^[^?]*\?(.*)$ $1;
        default "";
    }

    map $request_body $ids_log_body_args {
        "" "";
        default "&$request_body";
    }

    client_body_buffer_size 128k;

    log_format ids_tsv '$time_local\t$remote_addr\t$request_method\t$ids_log_path\t$ids_log_args$ids_log_body_args\t$status\t-\t$http_user_agent';

    server {
        listen 18080;
        server_name 127.0.0.1 localhost;

        root /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site;
        index index.php;

        access_log /Users/pyy/Desktop/毕业设计/项目根目录/vuln_php_site/logs/access.log ids_tsv;

        location = /.env {
            try_files $uri =404;
        }

        location = /.git/config {
            try_files $uri =404;
        }

        location /uploads/ {
            autoindex on;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
        }
    }
}
