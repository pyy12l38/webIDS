map $request_uri $ids_log_path {
    ~^([^?]*) $1;
    default $uri;
}

map $request_uri $ids_log_args {
    ~^[^?]*\?(.*)$ $1;
    default "";
}

map $request_body $ids_log_body_args {
    "" "";
    default "&$request_body";
}

client_body_buffer_size 128k;

log_format ids_tsv '$time_iso8601\t$remote_addr\t$request_method\t$ids_log_path\t$ids_log_args$ids_log_body_args\t$status\t-\t$http_user_agent';

server {
    listen 18080;
    server_name _;

    root /www/webIDS/vuln_php_site;
    index index.php;
    charset utf-8;

    access_log /www/webIDS/vuln_php_site/logs/access.log ids_tsv;
    error_log /www/webIDS/vuln_php_site/logs/error.log warn;

    # 漏洞演示站保留敏感文件暴露能力，便于 IDS 记录 .env /.git/config 等访问。
    location = /.env {
        try_files $uri =404;
    }

    location = /.git/config {
        try_files $uri =404;
    }

    location /uploads/ {
        autoindex on;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # 按服务器实际 PHP-FPM 配置修改为正确的 socket 或地址。
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }
}
